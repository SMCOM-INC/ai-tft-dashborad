name: Rollback Production Backoffice

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Backup timestamp to rollback to (YYYYMMDD_HHMMSS)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Perform Rollback
        run: |
          BUCKET_NAME="backoffice.apartmant.co.kr"
          BACKUP_PATH="s3://$BUCKET_NAME-backup/${{ inputs.version }}"
          DISTRIBUTION_ID="E3UOB7UEFH3B05"

          # Verify backup exists
          if ! aws s3 ls "$BACKUP_PATH" >/dev/null 2>&1; then
            echo "❌ Error: Backup version ${{ inputs.version }} not found"
            exit 1
          fi

          # Load and display metadata
          aws s3 cp "$BACKUP_PATH/deploy-meta.json" /tmp/meta.json
          echo "📋 Rolling back to deployment:"
          cat /tmp/meta.json

          # Perform rollback
          echo "🔄 Rolling back to version ${{ inputs.version }}..."

          # Clear current content
          aws s3 rm "s3://$BUCKET_NAME" --recursive

          # Restore from backup
          aws s3 sync "$BACKUP_PATH" "s3://$BUCKET_NAME" \
            --delete \
            --exclude "deploy-meta.json"

          # Invalidate CloudFront cache
          echo "🔄 Creating CloudFront invalidation..."
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

          echo "✅ Rollback completed successfully"

      - name: Send Discord notification - Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: '✅ APARTMANT V2 운영 관리자 페이지가 롤백되었습니다.'
          description: |
            Version: ${{ inputs.version }} 버전으로 롤백이 완료되었습니다.
            Rolled back by: ${{ github.actor }}
            [운영 관리자 페이지](https://backoffice.apartmant.co.kr)
          color: 0x2ecc71

      - name: Send Discord notification - Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: '❌ APARTMANT V2 운영 관리자 페이지 롤백이 실패하였습니다.'
          description: |
            Version: ${{ inputs.version }}
            Rollback Action: [ACTION 링크](https://github.com/SMCOM-INC/apt-admin-fe/actions/runs/${{ github.run_id }})
            Triggered by: ${{ github.actor }}
          color: 0xff0000
