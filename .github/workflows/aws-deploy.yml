name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  request-approval:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.approval.outputs.approved }}
    steps:
      - name: Request Deploy Approval
        id: approval
        uses: andrew-noh/discord-approval-action@v1.0.2
        with:
          discord-bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          channel-id: ${{ secrets.DISCORD_CHANNEL_ID }}
          title: '🚀 APARTMANT V2 관리자 페이지 배포 승인 요청'
          description: |
            **Branch:** ${{ github.ref_name }}
            **Triggered by:** ${{ github.actor }}
            **Repository:** ${{ github.repository }}
            ${{ github.event_name == 'push' && format('**Commit:** {0}', github.event.head_commit.message) || '' }}

            배포를 승인하려면 승인 버튼을 눌러주세요.
            ⚠️ _요청 유효 시간은 5분입니다._
          timeout: '300'
          run-id: ${{ github.run_id }}

      - name: Check if approval is denied
        if: failure() && steps.approval.outputs.denied == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: '⏰ 배포가 거절되었습니다.'
          description: |
            관리자 페이지 ${{ github.ref_name }} 브랜치 배포 요청이 거절되었거나 만료되었습니다.
            Triggered by: ${{ github.actor }}
          color: 0xff0000

  deploy:
    needs: request-approval
    if: needs.request-approval.outputs.approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_S3_URL: ${{ secrets.VITE_S3_URL }}
          VITE_APT_API_URL: ${{ github.ref == 'refs/heads/dev' && secrets.VITE_APT_API_URL_DEV || secrets.VITE_APT_API_URL_PROD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            npm run build:dev
          else
          npm run build:prod
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to S3 and CloudFront
        run: |
          # Validate that dist directory exists
          if [ ! -d "dist" ]; then
            echo "❌ Error: 'dist' directory not found. Build may have failed."
            exit 1
          fi

          # Set environment-specific variables
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            BUCKET_NAME="devbackoffice.apartmant.co.kr"
            DISTRIBUTION_ID="E1V0A1U3BHV0E9"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BUCKET_NAME="backoffice.apartmant.co.kr"
            DISTRIBUTION_ID="E3UOB7UEFH3B05"
            # Create backup for production environment
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            echo "📦 Creating backup of current production version..."
            aws s3 sync "s3://$BUCKET_NAME" "s3://$BUCKET_NAME-backup/$TIMESTAMP" \
              --quiet
            
            # Store deployment metadata
            echo "{
              \"timestamp\": \"$TIMESTAMP\",
              \"commit\": \"${{ github.sha }}\",
              \"deployer\": \"${{ github.actor }}\",
              \"branch\": \"${{ github.ref_name }}\"
            }" | aws s3 cp - "s3://$BUCKET_NAME-backup/$TIMESTAMP/deploy-meta.json"
          else
            echo "❌ Error: Unsupported branch ${GITHUB_REF#refs/heads/}"
            exit 1
          fi

          # Verify bucket exists
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "❌ Error: S3 bucket $BUCKET_NAME not found or no access"
            exit 1
          fi

          # Verify CloudFront distribution exists
          if ! aws cloudfront get-distribution --id "$DISTRIBUTION_ID" 2>/dev/null; then
            echo "❌ Error: CloudFront distribution $DISTRIBUTION_ID not found or no access"
            exit 1
          fi

          echo "🗑️ Removing existing files from S3..."
          aws s3 rm "s3://$BUCKET_NAME" --recursive

          echo "📤 Uploading new files to S3..."
          aws s3 sync dist "s3://$BUCKET_NAME" \
            --delete \
            --cache-control "max-age=31536000" \
            --exclude "index.html" \
            --exclude "*.html"

          # Upload HTML files with no-cache
          echo "📄 Uploading HTML files with no-cache headers..."
          aws s3 sync dist "s3://$BUCKET_NAME" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "🔄 Creating CloudFront invalidation..."
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

          echo "✅ Deployment completed successfully"

      - name: Send Discord notification - Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: '✅ APARTMANT V2 관리자 페이지 배포가 성공적으로 완료되었습니다.'
          description: |
            ${{ github.ref_name }} 브랜치에 대한 배포가 성공적으로 완료되었습니다.
            Deployed by: ${{ github.actor }}

            ${{ github.ref_name == 'dev' 
                && '[개발 관리자 페이지](https://devbackoffice.apartmant.co.kr)'
                || '[운영 관리자 페이지](https://backoffice.apartmant.co.kr)' }}
          color: 0x2ecc71

      - name: Send Discord notification - Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: '❌ APARTMANT V2 관리자 페이지 배포가 실패하였습니다.'
          description: |
            ${{ github.ref_name }} 브랜치에 대한 배포가 실패하였습니다.
            Deployment Action: [ACTION 링크](https://github.com/SMCOM-INC/apt-admin-fe/actions/runs/${{ github.run_id }})
            Triggered by: ${{ github.actor }}
          color: 0xff0000
